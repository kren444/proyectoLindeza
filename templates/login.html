<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso de Administrador</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
</head>
<body class="login-body">
    <div class="login-container">
        <h2>Acceso de Administrador</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="login-email">Correo electrónico</label>
                <input type="email" id="login-email" name="email" placeholder="admin@glamora.com" required>
            </div>
            <div class="form-group">
                <label for="login-password">Contraseña</label>
                <input type="password" id="login-password" name="password" required>
            </div>
            <p id="login-error" class="error-message hidden"></p>
            <button type="submit" class="btn">Iniciar Sesión</button>
        </form>
        <p class="hint">Usa <code>admin@glamora.com</code> / <code>admin</code> para acceder como administrador</p>
    </div>
    <script type="module" src="js/login.js"></script>
</body>
</html>
